name: Upload Build to S3

on:
  workflow_call:
    inputs:
      s3_bucket:
        required: true
        type: string
      s3_folder:
        required: true
        type: string
      cloudfront_distribution_id:
        required: true
        type: string
      invalidate_paths:
        required: true
        type: string

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Dynamic Build Names
        run: |
          HASH=$(date +%s)

          LOADER="Build.loader.${HASH}.js"
          FRAMEWORK="Build.framework.${HASH}.js.unityweb"
          DATA="Build.data.${HASH}.unityweb"
          WASM="Build.wasm.${HASH}.unityweb"

          cp Build/Build.loader.js Build/$LOADER
          cp Build/Build.framework.js.unityweb Build/$FRAMEWORK
          cp Build/Build.data.unityweb Build/$DATA
          cp Build/Build.wasm.unityweb Build/$WASM

          echo "LOADER=$LOADER" >> $GITHUB_ENV
          echo "FRAMEWORK=$FRAMEWORK" >> $GITHUB_ENV
          echo "DATA=$DATA" >> $GITHUB_ENV
          echo "WASM=$WASM" >> $GITHUB_ENV

      - name: Update index.html with Dynamic Names
        run: |
          sed -i "s|Build.loader.js|${LOADER}|g" index.html
          sed -i "s|Build.framework.js.unityweb|${FRAMEWORK}|g" index.html
          sed -i "s|Build.data.unityweb|${DATA}|g" index.html
          sed -i "s|Build.wasm.unityweb|${WASM}|g" index.html

      - name: Upload Build.loader.js
        run: |
          aws s3 cp Build/${{ env.LOADER }} \
          s3://${{ inputs.s3_bucket }}/${{ inputs.s3_folder }}/Build/${{ env.LOADER }} \
          --cache-control "public, max-age=172800, s-maxage=172800" \
          --content-type "application/javascript"

      - name: Upload Build.framework.js.unityweb
        run: |
          aws s3 cp Build/${{ env.FRAMEWORK }} \
          s3://${{ inputs.s3_bucket }}/${{ inputs.s3_folder }}/Build/${{ env.FRAMEWORK }} \
          --cache-control "public, max-age=172800, s-maxage=172800" \
          --content-type "application/javascript" \
          --content-encoding br

      - name: Upload Build.data.unityweb
        run: |
          aws s3 cp Build/${{ env.DATA }} \
          s3://${{ inputs.s3_bucket }}/${{ inputs.s3_folder }}/Build/${{ env.DATA }} \
          --cache-control "public, max-age=172800, s-maxage=172800" \
          --content-type "application/octet-stream" \
          --content-encoding br

      - name: Upload Build.wasm.unityweb
        run: |
          aws s3 cp Build/${{ env.WASM }} \
          s3://${{ inputs.s3_bucket }}/${{ inputs.s3_folder }}/Build/${{ env.WASM }} \
          --cache-control "public, max-age=172800, s-maxage=172800" \
          --content-type "application/wasm" \
          --content-encoding br

      - name: Upload index.html
        run: |
          aws s3 cp index.html \
          s3://${{ inputs.s3_bucket }}/${{ inputs.s3_folder }}/index.html \
          --cache-control "no-cache" \
          --content-type "text/html"

      - name: CloudFront Invalidation
        run: |
          aws cloudfront create-invalidation \
          --distribution-id ${{ inputs.cloudfront_distribution_id }} \
          --paths ${{ inputs.invalidate_paths }}

      # ---------------------------- #
      #   DISCORD NOTIFICATION      #
      # ---------------------------- #
      - name: Discord Notification
        if: always()
        run: |
          STATUS="${{ job.status }}"
          COLOR=3066993
          TITLE="✅ S3 Upload Successful"

          if [ "$STATUS" != "success" ]; then
            COLOR=15158332
            TITLE="❌ S3 Upload Failed"
          fi

          WEBHOOKS=(
            "https://discord.com/api/webhooks/1433719872063275108/ycFXIhb82-rI3pOMAJFMRgpMD72xadJJzW-t_3UohOZ_6bDIdLsIUOdX5_hxGA0oKvE_"
            "https://discord.com/api/webhooks/1494584505900601490/CE4PgrqU2tmG8VCPE6y3Zs-9AdZGaiLZKFOPxnB5DFztSIAzUA2d2kuwvcbWc_qMFg97"
          )

          for WEBHOOK in "${WEBHOOKS[@]}"; do
            curl --fail -H "Content-Type: application/json" \
              -X POST \
              -d "{
                \"username\": \"Deploy Bot\",
                \"embeds\": [{
                  \"title\": \"$TITLE\",
                  \"color\": $COLOR,
                  \"fields\": [
                    { \"name\": \"S3 Bucket\", \"value\": \"${{ inputs.s3_bucket }}\" },
                    { \"name\": \"S3 Folder\", \"value\": \"${{ inputs.s3_folder }}\" },
                    { \"name\": \"CloudFront ID\", \"value\": \"${{ inputs.cloudfront_distribution_id }}\" },
                    { \"name\": \"Triggered By\", \"value\": \"${{ github.actor }}\" },
                    { \"name\": \"Workflow\", \"value\": \"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\" }
                  ]
                }]
              }" \
              "$WEBHOOK"
          done
