name: Upload Build to S3

on:
  workflow_call:
    inputs:
      s3_bucket:
        required: true
        type: string
      s3_folder:
        required: true
        type: string
      cloudfront_distribution_id:
        required: true
        type: string
      invalidate_paths:
        required: true
        type: string

    secrets:
      DISCORD_WEBHOOK_DEV:
        required: false
      DISCORD_WEBHOOK_PROD:
        required: false

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve environment
        id: resolve_env
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          case "$BRANCH" in
            main)
              ENV="prod"
              ;;
            dev-build)
              ENV="dev"
              ;;
            *)
              echo "No environment mapping for branch '$BRANCH'"
              exit 1
              ;;
          esac

          echo "Using environment: $ENV"
          echo "deploy_env=$ENV" >> "$GITHUB_OUTPUT"

      - name: Load S3 cache policy
        id: cache_policy
        shell: bash
        run: |
          set -euo pipefail

          POLICY_FILE="s3-cache-policy.json"
          DEFAULT_BUILD_CACHE="public, max-age=0, must-revalidate, s-maxage=86400"
          DEFAULT_VERSION_CACHE="no-cache"

          if [ -f "$POLICY_FILE" ]; then
            if ! jq -e 'type == "object"' "$POLICY_FILE" >/dev/null; then
              echo "Invalid cache policy JSON: expected a JSON object."
              exit 1
            fi
            echo "Custom cache policy found."
          else
            echo "No custom cache policy found. Using defaults."
          fi

          get_cache() {
            local key="$1"
            local default_value="$2"
            local value=""

            if [ -f "$POLICY_FILE" ]; then
              if ! jq -e --arg key "$key" '
                if (has($key) | not) or .[$key] == null then
                  true
                elif (.[$key] | type) != "object" then
                  error("Policy for " + $key + " must be an object")
                elif .[$key].cache_control == null then
                  true
                elif (.[$key].cache_control | type) != "string" then
                  error("cache_control for " + $key + " must be a string")
                else
                  true
                end
              ' "$POLICY_FILE" >/dev/null; then
                echo "Invalid cache policy for $key" >&2
                return 1
              fi

              value=$(jq -r --arg key "$key" \
                '.[$key].cache_control // empty' "$POLICY_FILE")
            fi

            if [ -n "$value" ]; then
              printf '%s' "$value"
            else
              printf '%s' "$default_value"
            fi
          }

          LOADER_CACHE=$(get_cache \
            "Build/Build.loader.js" "$DEFAULT_BUILD_CACHE")
          DATA_CACHE=$(get_cache \
            "Build/Build.data.unityweb" "$DEFAULT_BUILD_CACHE")
          WASM_CACHE=$(get_cache \
            "Build/Build.wasm.unityweb" "$DEFAULT_BUILD_CACHE")
          VERSION_CACHE=$(get_cache \
            "version.json" "$DEFAULT_VERSION_CACHE")

          {
            printf 'loader_cache=%s\n' "$LOADER_CACHE"
            printf 'data_cache=%s\n' "$DATA_CACHE"
            printf 'wasm_cache=%s\n' "$WASM_CACHE"
            printf 'version_cache=%s\n' "$VERSION_CACHE"
          } >> "$GITHUB_OUTPUT"

      - name: Upload Build.loader.js
        env:
          CACHE_CONTROL: ${{ steps.cache_policy.outputs.loader_cache }}
          S3_BUCKET: ${{ inputs.s3_bucket }}
          S3_FOLDER: ${{ inputs.s3_folder }}
        shell: bash
        run: |
          set -euo pipefail
          aws s3 cp Build/Build.loader.js \
            "s3://${S3_BUCKET}/${S3_FOLDER}/Build/Build.loader.js" \
            --cache-control "$CACHE_CONTROL" \
            --content-type "application/javascript"

      - name: Upload Build.framework.js.unityweb
        env:
          S3_BUCKET: ${{ inputs.s3_bucket }}
          S3_FOLDER: ${{ inputs.s3_folder }}
        shell: bash
        run: |
          set -euo pipefail
          aws s3 cp Build/Build.framework.js.unityweb \
            "s3://${S3_BUCKET}/${S3_FOLDER}/Build/Build.framework.js.unityweb" \
            --cache-control "public, max-age=0, must-revalidate, s-maxage=86400" \
            --content-type "application/javascript" \
            --content-encoding br

      - name: Upload Build.data.unityweb
        env:
          CACHE_CONTROL: ${{ steps.cache_policy.outputs.data_cache }}
          S3_BUCKET: ${{ inputs.s3_bucket }}
          S3_FOLDER: ${{ inputs.s3_folder }}
        shell: bash
        run: |
          set -euo pipefail
          aws s3 cp Build/Build.data.unityweb \
            "s3://${S3_BUCKET}/${S3_FOLDER}/Build/Build.data.unityweb" \
            --cache-control "$CACHE_CONTROL" \
            --content-type "application/octet-stream" \
            --content-encoding br

      - name: Upload Build.wasm.unityweb
        env:
          CACHE_CONTROL: ${{ steps.cache_policy.outputs.wasm_cache }}
          S3_BUCKET: ${{ inputs.s3_bucket }}
          S3_FOLDER: ${{ inputs.s3_folder }}
        shell: bash
        run: |
          set -euo pipefail
          aws s3 cp Build/Build.wasm.unityweb \
            "s3://${S3_BUCKET}/${S3_FOLDER}/Build/Build.wasm.unityweb" \
            --cache-control "$CACHE_CONTROL" \
            --content-type "application/wasm" \
            --content-encoding br

      - name: Upload index.html
        env:
          S3_BUCKET: ${{ inputs.s3_bucket }}
          S3_FOLDER: ${{ inputs.s3_folder }}
        shell: bash
        run: |
          set -euo pipefail
          aws s3 cp index.html \
            "s3://${S3_BUCKET}/${S3_FOLDER}/index.html" \
            --cache-control "no-cache" \
            --content-type "text/html"

      - name: Check if StreamingAssets exists
        id: check_streaming_assets
        shell: bash
        run: |
          if [ -d "StreamingAssets" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload StreamingAssets folder
        if: steps.check_streaming_assets.outputs.exists == 'true'
        env:
          S3_BUCKET: ${{ inputs.s3_bucket }}
          S3_FOLDER: ${{ inputs.s3_folder }}
        shell: bash
        run: |
          set -euo pipefail
          aws s3 sync StreamingAssets/ \
            "s3://${S3_BUCKET}/${S3_FOLDER}/StreamingAssets/" \
            --cache-control "public, max-age=0, must-revalidate, s-maxage=86400"

      - name: Check if TemplateData exists
        id: check_template_data
        shell: bash
        run: |
          if [ -d "TemplateData" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload TemplateData folder
        if: steps.check_template_data.outputs.exists == 'true'
        env:
          S3_BUCKET: ${{ inputs.s3_bucket }}
          S3_FOLDER: ${{ inputs.s3_folder }}
        shell: bash
        run: |
          set -euo pipefail
          aws s3 sync TemplateData/ \
            "s3://${S3_BUCKET}/${S3_FOLDER}/TemplateData/" \
            --cache-control "public, max-age=0, must-revalidate, s-maxage=86400"

      - name: Update version.json
        env:
          S3_BUCKET: ${{ inputs.s3_bucket }}
          S3_FOLDER: ${{ inputs.s3_folder }}
          VERSION_CACHE: ${{ steps.cache_policy.outputs.version_cache }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION_FILE="version.json"
          S3_VERSION_PATH="s3://${S3_BUCKET}/${S3_FOLDER}/version.json"

          if aws s3 cp "$S3_VERSION_PATH" "$VERSION_FILE" 2>/dev/null; then
            CURRENT_VERSION=$(jq -er '.version' "$VERSION_FILE") || {
              echo "Invalid version.json in S3."
              exit 1
            }

            if [[ ! "$CURRENT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid semantic version: $CURRENT_VERSION"
              exit 1
            fi

            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
            PATCH=$((PATCH + 1))
            NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          else
            NEW_VERSION="0.0.1"
            echo "No version.json found. Starting at $NEW_VERSION"
          fi

          printf '{\n    "version": "%s"\n}\n' "$NEW_VERSION" > "$VERSION_FILE"

          aws s3 cp "$VERSION_FILE" "$S3_VERSION_PATH" \
            --cache-control "$VERSION_CACHE" \
            --content-type "application/json"

          rm -f "$VERSION_FILE"
          echo "version.json updated to $NEW_VERSION"

      - name: CloudFront Invalidation
        env:
          DISTRIBUTION_ID: ${{ inputs.cloudfront_distribution_id }}
          INVALIDATE_PATHS: ${{ inputs.invalidate_paths }}
        shell: bash
        run: |
          set -euo pipefail
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "$INVALIDATE_PATHS"

      - name: Discord Notification
        if: always()
        env:
          DEPLOY_ENV: ${{ steps.resolve_env.outputs.deploy_env }} 
          DISCORD_WEBHOOK_DEV: ${{ secrets.DISCORD_WEBHOOK_DEV }}
          DISCORD_WEBHOOK_PROD: ${{ secrets.DISCORD_WEBHOOK_PROD }}
          S3_BUCKET: ${{ inputs.s3_bucket }}
          S3_FOLDER: ${{ inputs.s3_folder }}
          CLOUDFRONT_ID: ${{ inputs.cloudfront_distribution_id }}
          ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || github.event.pull_request.title || '' }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail

          case "$DEPLOY_ENV" in
            dev)
              WEBHOOK="$DISCORD_WEBHOOK_DEV"
              ENVIRONMENT="Development"
              ;;
            prod)
              WEBHOOK="$DISCORD_WEBHOOK_PROD"
              ENVIRONMENT="Production"
              ;;
            *)
              echo "Invalid deploy_env: $DEPLOY_ENV"
              exit 1
              ;;
          esac

          if [ -z "$WEBHOOK" ]; then
            echo "Discord webhook is missing for $ENVIRONMENT."
            exit 1
          fi

          # For manual runs, get the commit subject from the checked-out commit.
          if [ -z "$COMMIT_MESSAGE" ]; then
            COMMIT_MESSAGE=$(git log -1 --format=%s "$COMMIT_SHA" 2>/dev/null || true)
          fi

          if [ -z "$COMMIT_MESSAGE" ]; then
            COMMIT_MESSAGE="Commit message unavailable"
          fi

          SHORT_SHA="${COMMIT_SHA:0:7}"
          COMMIT_URL="https://github.com/${REPOSITORY}/commit/${COMMIT_SHA}"

          COLOR=3066993
          TITLE="✅ $ENVIRONMENT S3 Upload Successful"

          if [ "$JOB_STATUS" != "success" ]; then
            COLOR=15158332
            TITLE="❌ $ENVIRONMENT S3 Upload Failed"
          fi

          PAYLOAD=$(jq -n \
            --arg title "$TITLE" \
            --arg environment "$ENVIRONMENT" \
            --arg branch "$BRANCH" \
            --arg commit_id "[$SHORT_SHA]($COMMIT_URL)" \
            --arg commit_message "$COMMIT_MESSAGE" \
            --arg bucket "$S3_BUCKET" \
            --arg folder "$S3_FOLDER" \
            --arg distribution "$CLOUDFRONT_ID" \
            --arg actor "$ACTOR" \
            --arg workflow "https://github.com/$REPOSITORY/actions/runs/$RUN_ID" \
            --argjson color "$COLOR" \
            '{
              username: "Deploy Bot",
              embeds: [{
                title: $title,
                color: $color,
                fields: [
                  {name: "Environment", value: $environment},
                  {name: "Branch", value: $branch},
                  {name: "Commit ID", value: $commit_id},
                  {name: "Commit Message", value: ($commit_message | .[0:1000])},
                  {name: "S3 Bucket", value: $bucket},
                  {name: "S3 Folder", value: $folder},
                  {name: "CloudFront ID", value: $distribution},
                  {name: "Triggered By", value: $actor},
                  {name: "Workflow", value: $workflow}
                ]
              }]
            }')

          curl --fail --silent --show-error \
            -H "Content-Type: application/json" \
            -X POST \
            -d "$PAYLOAD" \
            "$WEBHOOK"
